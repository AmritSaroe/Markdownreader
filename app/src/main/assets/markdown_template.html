<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --text-color: #1C1B1F;
            --bg-color: #FFFBFE;
            --link-color: #6750A4;
            --code-bg: #E7E0EC;
            --border-color: #CAC4D0;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            font-size: 16px;
            line-height: 1.75;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            padding: 48px 16px 80px 16px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            -webkit-text-size-adjust: 100%;
        }

        /* Headings */
        h1, h2, h3, h4, h5, h6 {
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            line-height: 1.3;
            font-weight: 600;
        }
        h1 { font-size: 1.75em; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3em; }
        h2 { font-size: 1.4em; border-bottom: 1px solid var(--border-color); padding-bottom: 0.25em; }
        h3 { font-size: 1.2em; }
        h4 { font-size: 1.1em; }
        h5 { font-size: 1em; }
        h6 { font-size: 0.9em; opacity: 0.8; }

        #content > h1:first-child,
        #content > h2:first-child,
        #content > h3:first-child { margin-top: 0; }

        /* Links */
        a { color: var(--link-color); text-decoration: none; }
        a:active { opacity: 0.7; }

        /* Paragraphs */
        p { margin: 0.8em 0; }

        /* Inline code */
        code {
            background-color: var(--code-bg);
            padding: 0.15em 0.4em;
            border-radius: 4px;
            font-size: 0.88em;
            font-family: 'Roboto Mono', 'Fira Code', monospace;
        }

        /* Code blocks */
        pre {
            background-color: var(--code-bg);
            padding: 14px 16px;
            border-radius: 12px;
            overflow-x: auto;
            line-height: 1.5;
            margin: 1em 0;
            -webkit-overflow-scrolling: touch;
        }
        pre code {
            background: none;
            padding: 0;
            font-size: 0.85em;
            border-radius: 0;
        }

        /* Blockquotes */
        blockquote {
            border-left: 3px solid var(--link-color);
            margin: 1em 0;
            padding: 0.25em 1em;
            opacity: 0.85;
        }
        blockquote > p:first-child { margin-top: 0; }
        blockquote > p:last-child { margin-bottom: 0; }

        /* Tables */
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 1em 0;
            display: block;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background-color: var(--code-bg);
            font-weight: 600;
        }

        /* Images */
        img { max-width: 100%; height: auto; border-radius: 8px; }

        /* Horizontal rule */
        hr { border: none; border-top: 1px solid var(--border-color); margin: 2em 0; }

        /* Lists */
        ul, ol { padding-left: 1.5em; }
        li { margin: 0.25em 0; }
        li > p { margin: 0.4em 0; }

        /* Task lists */
        .task-item {
            list-style-type: none;
            margin-left: -1.5em;
        }
        .task-item input[type="checkbox"] {
            margin-right: 0.5em;
            pointer-events: none;
        }

        /* Strikethrough */
        del, s { text-decoration: line-through; opacity: 0.7; }
    </style>
</head>
<body>
    <article id="content"></article>

    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
    <script>
        function renderMarkdown(text) {
            var el = document.getElementById('content');
            try {
                if (typeof window.markdownit !== 'undefined') {
                    var md = window.markdownit({
                        html: true,
                        linkify: true,
                        breaks: true,
                        typographer: false
                    });

                    var html = md.render(text);

                    // Task list support
                    html = html.replace(/<li>\[ \] /g,
                        '<li class="task-item"><input type="checkbox" disabled> ');
                    html = html.replace(/<li>\[x\] /gi,
                        '<li class="task-item"><input type="checkbox" checked disabled> ');
                    html = html.replace(/<li><p>\[ \] /g,
                        '<li class="task-item"><p><input type="checkbox" disabled> ');
                    html = html.replace(/<li><p>\[x\] /gi,
                        '<li class="task-item"><p><input type="checkbox" checked disabled> ');

                    el.innerHTML = html;
                } else {
                    // Fallback when offline: show as preformatted text
                    el.style.whiteSpace = 'pre-wrap';
                    el.style.fontFamily = 'monospace';
                    el.textContent = text;
                }
            } catch (e) {
                el.style.whiteSpace = 'pre-wrap';
                el.textContent = text;
            }
        }

        function setThemeColors(text, bg, link, codeBg, border) {
            var s = document.documentElement.style;
            s.setProperty('--text-color', text);
            s.setProperty('--bg-color', bg);
            s.setProperty('--link-color', link);
            s.setProperty('--code-bg', codeBg);
            s.setProperty('--border-color', border);
        }

        // Tap handler for immersive mode toggle
        document.addEventListener('click', function (e) {
            var t = e.target;
            if (t.tagName !== 'A' && t.tagName !== 'INPUT' && t.tagName !== 'BUTTON') {
                if (typeof Android !== 'undefined' && Android.onContentTapped) {
                    Android.onContentTapped();
                }
            }
        });

        // Render when all scripts have loaded
        window.onload = function () {
            if (typeof Android !== 'undefined') {
                renderMarkdown(Android.getContent());
                Android.onPageReady();
            }
        };
    </script>
</body>
</html>
